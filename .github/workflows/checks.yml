# The checks that need no phone and no game (TEST_PLAN.md, part 1): shared code identical on both platforms,
# settings saved and read the same way, the version everywhere, the Android native code compiled and linked on the
# host, the iOS declaration order, and the live game logic run against fake games (pin turns, obstacle racks, loft
# and landing, the menu button's spot). A couple of minutes on every push and pull request.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: PyYAML (for the workflow check)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml || echo "no PyYAML, so the workflow parse check is skipped"

      - name: Run all checks
        run: sh tools/tests/run_all.sh
