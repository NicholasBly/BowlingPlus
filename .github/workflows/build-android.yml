# Builds BowlingPlus for Android and produces a patched, installable APK.
#
# The game APK is NOT committed. Provide it one of two ways:
#   * set the repository secret GAME_APK_URL to a direct link to the game's .apks/.xapk bundle (or a single
#     universal .apk), or
#   * trigger the workflow manually and paste a URL into the apk_url input.
# The build downloads it, compiles the Java side to a dex, embeds it in libmain.so, builds the native library
# with the NDK, then merges + patches + signs the APK with tools/patch_apk.py.
#
# Output: an artifact "BowlingPlus-android" containing BowlingPlus.apk (signed with a throwaway debug key, so
# uninstall the Play Store copy before installing).
name: Build BowlingPlus (Android)

on:
  push:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the game APK / .apks / .xapk bundle (overrides the GAME_APK_URL secret)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install NDK, build-tools, platform
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Get APKEditor
        run: |
          curl -L -o "$HOME/APKEditor.jar" \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.3/APKEditor-1.4.3.jar
          echo "APKEDITOR=$HOME/APKEditor.jar" >> "$GITHUB_ENV"

      # 1) Java side -> classes.dex
      - name: Build the Java side (dex)
        run: |
          AJAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          curl -sSL -o /tmp/zxing.jar https://repo1.maven.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar
          mkdir -p /tmp/cls "$GITHUB_WORKSPACE/dexout"
          javac --release 11 -cp "$AJAR:/tmp/zxing.jar" -d /tmp/cls $(find android/java -name '*.java')
          "$BUILD_TOOLS/d8" --release --min-api 23 --lib "$AJAR" --classpath /tmp/zxing.jar \
            --output "$GITHUB_WORKSPACE/dexout" $(find /tmp/cls -name '*.class')

      - name: Merge multidex if needed, then embed the dex
        run: |
          cd "$GITHUB_WORKSPACE/dexout"
          # The Java side is small and single-dex, but merge defensively so the embed is always one file.
          if [ -f classes2.dex ]; then
            "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/d8" --version || true
            "$BUILD_TOOLS/d8" classes*.dex --output .
          fi
          cp classes.dex "$GITHUB_WORKSPACE/android/native/bowlingplus.dex"
          python3 "$GITHUB_WORKSPACE/android/tools/bin2header.py" \
            "$GITHUB_WORKSPACE/android/native/bowlingplus.dex" kBPDex \
            "$GITHUB_WORKSPACE/android/native/bp_dex.h"

      # 2) native library -> libmain.so (arm64)
      - name: Build the native library
        working-directory: android/native
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
            -DGENERATED_DIR="$PWD" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
          cp build/libmain.so "$GITHUB_WORKSPACE/libmain.so"
          ls -la "$GITHUB_WORKSPACE/libmain.so"

      # 3) fetch the game
      - name: Download the game APK
        env:
          GAME_APK_URL: ${{ secrets.GAME_APK_URL }}
          INPUT_URL: ${{ github.event.inputs.apk_url }}
        run: |
          URL="${INPUT_URL:-$GAME_APK_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No game APK URL. Set the GAME_APK_URL secret or pass apk_url on manual run."
            exit 1
          fi
          curl -L -o "$GITHUB_WORKSPACE/game_input" "$URL"
          file "$GITHUB_WORKSPACE/game_input"

      # 4) merge + patch + sign
      - name: Patch the APK
        run: |
          python3 android/tools/patch_apk.py "$GITHUB_WORKSPACE/game_input" \
            --lib "$GITHUB_WORKSPACE/libmain.so" \
            --out "$GITHUB_WORKSPACE/BowlingPlus.apk" \
            --apkeditor "$APKEDITOR" \
            --apksigner "$BUILD_TOOLS/apksigner" \
            --zipalign "$BUILD_TOOLS/zipalign" \
            --aapt2 "$BUILD_TOOLS/aapt2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BowlingPlus-android
          path: BowlingPlus.apk
          if-no-files-found: error
