# Builds BowlingPlus for Android (android/build.sh) and, when it can get the game, a patched installable APK.
#
# The game is NOT in the repo (it's the developer's app, and too big for git). Give the workflow a direct
# download link to the game's .apks / .xapk bundle or a single .apk, either:
#   * as the repository secret GAME_APK_URL (Settings > Secrets and variables > Actions), or
#   * in the apk_url box when you start it by hand (Actions > Build BowlingPlus (Android) > Run workflow).
# Without one, it still builds and uploads libmain.so + bowlingplus.dex, so you see whether the code compiles.
#
# Optional, to sign every build with the same key (so a new build installs over the old one and keeps your
# game data): secrets ANDROID_KEYSTORE_B64 (base64 of the .jks/.keystore), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See android/README.md.
name: Build BowlingPlus (Android)

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the game's .apks / .xapk / .apk (overrides the GAME_APK_URL secret)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list asks for the retired "tools" package, so list what we need.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Get the game
        id: game
        env:
          GAME_APK_URL: ${{ secrets.GAME_APK_URL }}
          INPUT_URL: ${{ github.event.inputs.apk_url }}
        run: |
          URL="${INPUT_URL:-$GAME_APK_URL}"
          if [ -z "$URL" ]; then
            echo "::warning::No game link (GAME_APK_URL secret or apk_url input): building the library and dex only."
            echo "have=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/game"
          curl -fL --retry 3 -o "$RUNNER_TEMP/game/game_input" "$URL"
          file "$RUNNER_TEMP/game/game_input"
          echo "have=1" >> "$GITHUB_OUTPUT"

      - name: Signing key (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bowlingplus.keystore"
            echo "BP_KEYSTORE=$RUNNER_TEMP/bowlingplus.keystore" >> "$GITHUB_ENV"
            echo "Signing with the repository's keystore."
          else
            echo "No ANDROID_KEYSTORE_B64 secret: signing with a throwaway key."
          fi

      - name: Build
        env:
          BP_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/build.sh
          if [ "${{ steps.game.outputs.have }}" = "1" ]; then
            android/build.sh "$RUNNER_TEMP/game/game_input"
          else
            android/build.sh
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BowlingPlus-android
          path: |
            android/out/BowlingPlus.apk
            android/out/libmain.so
            android/out/bowlingplus.dex
          if-no-files-found: error
