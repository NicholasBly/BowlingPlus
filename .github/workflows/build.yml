# Builds the iOS tweak (BowlingPlus.dylib + .deb) with Theos and, when it can get the game, the patched IPA.
#
# The IPA is what makes 120 FPS possible: iOS caps apps at 60 Hz unless the app's Info.plist has
# CADisableMinimumFrameDurationOnPhone = YES, and the game ships it set to NO. tools/inject_ipa.py sets it
# (and adds the dylib). Injecting the dylib with a signer's own option (Sideloadly, Signulous) or installing
# the .deb leaves the game's NO in place, so 120 FPS mode then runs at 60 ("plist120=0" in Copy debug info).
#
# The game is NOT in the repo. Give the workflow a direct download link to the decrypted game .ipa, either:
#   * as the repository secret GAME_IPA_URL (Settings > Secrets and variables > Actions), or
#   * in the ipa_url box when you start it by hand (Actions > Build BowlingPlus > Run workflow).
# Without one, it still builds and uploads the dylib + .deb, so you see whether the code compiles.
#
# Signulous: with the repository secret SIGNULOUS_UDID (your device's UDID), every branch build that makes the IPA
# also sends it to Signulous, which signs it for that device: it then shows up in the Signulous app to install
# (tools/signulous_upload.py, the same upload GlowRedux uses). Tag pushes don't upload (they build a commit a branch
# push already built), and a newer push to the same branch cancels a build still running. A Signulous problem
# doesn't fail the build: the IPA is still in the artifact.
name: Build BowlingPlus

on:
  push:
    paths-ignore:
      - "android/**"
      - ".github/workflows/build-android.yml"
      - "**.md"
      - "Port/**"
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to the decrypted game .ipa (overrides the GAME_IPA_URL secret)"
        required: false
        type: string
      display_name:
        description: "App name on Signulous and the home screen (blank = the game's own name)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Mapped here so a step can check it (the secrets context isn't allowed in `if:`, env is)
      SIGNULOUS_UDID: ${{ secrets.SIGNULOUS_UDID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid make xz

      - name: Get Theos
        run: |
          git clone --recursive --depth=1 --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: gmake package FINALPACKAGE=1

      - name: Collect files
        run: |
          mkdir -p out
          cp "$(find .theos/obj -name BowlingPlus.dylib -not -path '*/arm64/*' | head -n 1)" out/
          cp packages/*.deb out/ 2>/dev/null || true
          ls -la out

      - name: Patched IPA (120 FPS-capable)
        env:
          GAME_IPA_URL: ${{ secrets.GAME_IPA_URL }}
          INPUT_URL: ${{ github.event.inputs.ipa_url }}
        run: |
          URL="${INPUT_URL:-$GAME_IPA_URL}"
          if [ -z "$URL" ]; then
            echo "::warning::No game link (GAME_IPA_URL secret or ipa_url input): dylib + .deb only. Build the IPA with tools/inject_ipa.py, or 120 FPS stays capped at 60."
            exit 0
          fi
          curl -fL --retry 3 -o "$RUNNER_TEMP/game.ipa" "$URL"
          VER="$(sed -n 's/^Version: //p' control)"
          python3 tools/inject_ipa.py "$RUNNER_TEMP/game.ipa" out/BowlingPlus.dylib "out/BowlingPlus-$VER.ipa"
          # check the result instead of trusting it: the 120 Hz key must be YES and the dylib must be inside
          python3 - "out/BowlingPlus-$VER.ipa" <<'PY'
          import plistlib, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          plist = next(n for n in z.namelist() if re.match(r'Payload/[^/]+\.app/Info\.plist$', n))
          ok120 = plistlib.loads(z.read(plist)).get('CADisableMinimumFrameDurationOnPhone') is True
          dylib = any(n.endswith('/Frameworks/BowlingPlus.dylib') for n in z.namelist())
          print('120 Hz allowed:', ok120, '| dylib inside:', dylib)
          sys.exit(0 if ok120 and dylib else 1)
          PY
          ls -la out

      - name: Upload to Signulous
        id: signulous
        # Only with the SIGNULOUS_UDID secret, only when the IPA was made, never for a tag. Signs the app for your
        # device; it then appears in the Signulous app. Non-fatal: the IPA is still in the artifact below.
        if: ${{ env.SIGNULOUS_UDID != '' && !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        env:
          INPUT_NAME: ${{ github.event.inputs.display_name }}
        run: |
          set -euo pipefail
          IPA="$(ls out/*.ipa 2>/dev/null | head -n 1 || true)"
          if [ -z "$IPA" ]; then
            echo "::notice::No IPA in this build (no game link), so nothing to send to Signulous."
            exit 0
          fi
          # the game's own name, version and bundle ID, so Signulous installs it as the game
          eval "$(python3 -I - "$IPA" <<'PY'
          import plistlib, re, shlex, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          n = next(x for x in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', x))
          p = plistlib.loads(z.read(n))
          for k, v in (('APP_NAME', p.get('CFBundleDisplayName') or p.get('CFBundleName') or 'Bowling'),
                       ('APP_VERSION', p.get('CFBundleShortVersionString', '1.0')),
                       ('APP_BUNDLE', p['CFBundleIdentifier'])):
              print('%s=%s' % (k, shlex.quote(str(v))))
          PY
          )"
          echo "BowlingPlus $(sed -n 's/^Version: //p' control) on ${APP_NAME} ${APP_VERSION} (${APP_BUNDLE})"
          python3 -I tools/signulous_upload.py --ipa "$IPA" --name "${INPUT_NAME:-$APP_NAME}" \
            --version "$APP_VERSION" --bundle "$APP_BUNDLE" --push

      - uses: actions/upload-artifact@v4
        with:
          name: BowlingPlus
          path: out/
