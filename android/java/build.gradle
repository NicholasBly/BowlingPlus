// Builds only the BowlingPlus Java side into a classes.dex that gets embedded in libmain.so (bin2header.py).
// It is an app module purely so the Android Gradle Plugin produces a dex; nothing from here is installed as
// its own app. The game APK is patched separately by tools/patch_apk.py.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bowlingplus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bowlingplus.builder'   // irrelevant: this APK is never shipped, only its dex is used
        minSdk 23                                 // matches the game's minSdkVersion
        targetSdk 35
        versionCode 10600
        versionName '1.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false          // keep class names: the native side loads them by name (com.bowlingplus.BP/N)
        }
    }

    // The sources live at android/java/com/... (not the AGP default src/main/java), kept flat for the repo.
    sourceSets {
        main {
            java.srcDirs = ['.']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    // The classes we compile against but that the game already provides at runtime (Unity, AndroidX) are not
    // bundled; we only bundle ZXing (for QR). org.json is part of Android.
    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // QR encode/decode. 'core' is pure Java, so it dexes cleanly and has no resources.
    implementation 'com.google.zxing:core:3.5.3'
}
